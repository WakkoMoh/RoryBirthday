<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 22nd Birthday Rory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffebe9; 
            --text-color: #5a4646;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden; 
            position: relative;
        }

       
        .effect-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart, .twinkling-star {
            position: absolute;
            opacity: 0;
        }

        .floating-heart {
            font-size: 1.5rem;
            animation: floatUp linear infinite;
        }

        .twinkling-star {
            font-size: 1.2rem;
            color: #ffd700;
            animation: twinkle ease-in-out infinite alternate;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.1); }
        }

       
        .content {
            z-index: 1;
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

       
        h1 {
            font-family: 'Caveat', cursive;
            font-size: clamp(2.8rem, 6vw, 4.5rem);
            margin-bottom: 0.5rem;
            color: #5a4646;
        }

        .nowrap {
            white-space: nowrap;
        }

       
        .message {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.8;
            margin: 1.5rem 0 2.5rem 0;
            padding: 0 1.5rem;
            max-width: 650px;
            color: #5a4646;
        }

       
        .cake-container {
            width: 280px;
            height: auto;
            margin: 15px 0;
            position: relative;
        }

       
        .flame {
            transform-origin: center bottom;
            animation: flicker 1.5s ease-in-out infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) translateY(0); opacity: 0.9; }
            50% { transform: scale(1.05) translateY(-1px) rotate(-2deg); opacity: 1; }
            100% { transform: scale(0.95) translateY(1px) rotate(2deg); opacity: 0.8; }
        }

       
        .music-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #fff0f3;
            border: 2px solid #ffccd5;
            padding: 12px 28px;
            border-radius: 30px;
            color: #8c6b6b;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
        }

        .music-btn:hover {
            background-color: #ffccd5;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 182, 193, 0.5);
        }
    </style>
</head>
